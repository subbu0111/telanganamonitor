name: CivicDarpan scheduled reports
on:
  schedule:
    - cron: '17 */6 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      report:
        type: choice
        options: [analysis, daily]
        default: analysis
permissions:
  contents: write
  pages: write
concurrency:
  group: civicdarpan-public-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Refresh approved sources and reports
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REPORT_TYPE: ${{ github.event.schedule == '30 1 * * *' && 'daily' || inputs.report || 'analysis' }}
        run: |
          if [ "$REPORT_TYPE" = "daily" ]; then
            node scripts/refresh-public.mjs --daily
          else
            node scripts/refresh-public.mjs
          fi
      - run: node --test tests/*.test.mjs
      - name: Commit validated reports
        run: |
          git config user.name "CivicDarpan Bot"
          git config user.email "civicdarpan@users.noreply.github.com"
          git add data/news.json data/intelligence.json data/impact.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh source-supported CivicDarpan reports"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request GitHub Pages refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
